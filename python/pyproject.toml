[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bazarish-auth"
version = "0.1.0"
description = "Sign-in with a Bazarish key: issue a challenge, verify the signed answer"
license = "Unlicense"
requires-python = ">=3.9"
dependencies = ["cryptography>=48"]

[tool.setuptools]
packages = ["bazarish_auth"]
